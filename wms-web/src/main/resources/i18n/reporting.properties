reporting.fulfillment.title=Order fulfilment
reporting.fulfillment.hint=Orders placed in the period. Line fill rate and quantity fill rate cover finished orders (shipped or closed short); quantity mixes item units. Shipped on time counts shipped orders that have a required date. Overdue open orders are counted as of today, whatever the period. Blank dates mean the last 30 days.
