<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'locations')}">
<head><title th:text="#{locations.edit.title}">Edit Location</title></head>
<body>

<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <div class="card-title">
                        <span th:text="#{locations.edit.title}">Edit Location</span>: <span th:text="${code}">A-01</span>
                    </div>
                    <hr>
                    <th:block th:replace="~{::detailsCard}"></th:block>
                </div>
            </div>
        </div>
    </div>
</th:block>

<div id="details-card" th:fragment="detailsCard">
    <form th:object="${form}" method="post"
          th:action="@{/locations/{id}/details(id=${locationId})}"
          th:hx-post="@{/locations/{id}/details(id=${locationId})}"
          hx-target="#details-card" hx-swap="outerHTML">
        <div class="alert alert-success" th:if="${saved}" th:text="#{common.saved}">Saved</div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <div class="form-row">
            <div class="form-group col-md-4">
                <label th:text="#{locations.field.code}">Code</label>
                <input type="text" class="form-control" th:value="${code}" readonly>
            </div>
            <div class="form-group col-md-4">
                <label th:text="#{locations.field.type}">Type</label>
                <input type="text" class="form-control" th:value="#{'location.type.' + ${type}}" readonly>
            </div>
            <div class="form-group col-md-4">
                <label th:text="#{locations.field.parent}">Parent location</label>
                <input type="text" class="form-control" th:value="${parentCode} ?: #{locations.field.parent.none}" readonly>
            </div>
        </div>

        <div th:replace="~{fragments/form-fields :: input('name', 'locations.field.name', 'text', false, 'off')}"></div>

        <div class="form-group">
            <label for="usage" th:text="#{locations.field.usage}">Usage</label>
            <select id="usage" class="form-control" th:field="*{usage}" th:errorclass="is-invalid" th:disabled="${!isBin}">
                <option th:each="u : ${usages}" th:value="${u}" th:text="#{'location.usage.' + ${u}}">Storage</option>
            </select>
            <div class="invalid-feedback" th:errors="*{usage}">error</div>
            <small class="wms-muted" th:text="#{locations.field.usage.hint}">Only bins can have a usage other than Storage.</small>
        </div>

        <div th:replace="~{fragments/form-fields :: input('barcode', 'locations.field.barcode', 'text', false, 'off')}"></div>
        <div th:replace="~{fragments/form-fields :: input('maxCapacity', 'locations.field.maxCapacity', 'text', false, 'off')}"></div>

        <button type="submit" class="btn btn-light px-5" th:text="#{locations.update}">Update location</button>
        <a class="btn btn-secondary px-4" th:href="@{/locations}" th:text="#{common.cancel}">Cancel</a>
    </form>
</div>

</body>
</html>
