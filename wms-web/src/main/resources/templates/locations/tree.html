<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'locations')}">
<head><title th:text="#{locations.tree.title}">Location Tree</title></head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="card-title mb-0" th:text="#{locations.tree.title}">Location Tree</div>
                            <small class="wms-muted" th:text="#{locations.subtitle(${warehouseLabel})}">Warehouse A-01</small>
                        </div>
                        <a class="btn btn-secondary px-3" th:href="@{/locations}">
                            <i class="zmdi zmdi-view-headline"></i> <span th:text="#{locations.listView}">List view</span></a>
                    </div>
                    <hr>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th scope="col" th:text="#{locations.col.code}">Code</th>
                                <th scope="col" th:text="#{locations.col.name}">Name</th>
                                <th scope="col" th:text="#{locations.col.type}">Type</th>
                                <th scope="col" th:text="#{locations.col.usage}">Usage</th>
                                <th scope="col" th:text="#{locations.col.status}">Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="row : ${rows}">
                                <td class="font-weight-bold">
                                    <span class="d-inline-block" th:classappend="|wms-indent-${row.depth()}|" th:text="${row.node().code()}">A-01</span>
                                </td>
                                <td th:text="${row.node().name()} ?: '-'">Aisle 1</td>
                                <td><span class="badge badge-primary" th:text="#{'location.type.' + ${row.node().type()}}">Aisle</span></td>
                                <td th:text="#{'location.usage.' + ${row.node().usage()}}">Storage</td>
                                <td>
                                    <span class="badge badge-success" th:if="${row.node().active()}" th:text="#{common.active}">Active</span>
                                    <span class="badge badge-danger" th:unless="${row.node().active()}" th:text="#{common.inactive}">Inactive</span>
                                </td>
                            </tr>
                            <tr th:if="${rows.isEmpty()}">
                                <td colspan="5" class="text-center wms-muted" th:text="#{common.noResults}">No results found</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
