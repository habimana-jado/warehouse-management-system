<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'customers')}">
<head><title th:text="#{customers.list.title}">Customers</title></head>
<body>

<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{customers.list.title}">Customers</div>
                        <a class="btn btn-light px-4" th:if="${canManage}" th:href="@{/customers/new}">
                            <i class="zmdi zmdi-plus"></i> <span th:text="#{customers.new}">New customer</span></a>
                    </div>
                    <hr>

                    <form id="customer-filters" method="get" th:action="@{/customers}" class="mb-3"
                          th:hx-get="@{/customers}" hx-target="#customers-results" hx-swap="outerHTML"
                          hx-push-url="true" hx-trigger="input delay:400ms, submit">
                        <div class="position-relative has-icon-right">
                            <input type="search" name="q" class="form-control input-shadow" th:value="${q}"
                                   th:placeholder="#{customers.search.placeholder}" autocomplete="off">
                            <div class="form-control-position"><i class="icon-magnifier"></i></div>
                        </div>
                    </form>

                    <div id="customers-results" th:fragment="results">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col">
                                        <a class="wms-sort" th:classappend="${sorts['code'].cssClass()}"
                                           th:href="${sorts['code'].url()}" th:hx-get="${sorts['code'].url()}"
                                           th:text="#{customers.col.code}">Code</a></th>
                                    <th scope="col">
                                        <a class="wms-sort" th:classappend="${sorts['name'].cssClass()}"
                                           th:href="${sorts['name'].url()}" th:hx-get="${sorts['name'].url()}"
                                           th:text="#{customers.col.name}">Name</a></th>
                                    <th scope="col" th:text="#{customers.col.contact}">Contact</th>
                                    <th scope="col" th:text="#{customers.col.email}">Email</th>
                                    <th scope="col">
                                        <a class="wms-sort" th:classappend="${sorts['city'].cssClass()}"
                                           th:href="${sorts['city'].url()}" th:hx-get="${sorts['city'].url()}"
                                           th:text="#{customers.col.city}">City</a></th>
                                    <th scope="col" th:text="#{customers.col.status}">Status</th>
                                    <th scope="col"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <th:block th:each="s : ${page.content()}">
                                    <tr th:replace="~{::row}"></tr>
                                </th:block>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="7" class="text-center wms-muted" th:text="#{common.noResults}">No
                                        results found
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}">Showing
                                1-15 of 3</small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- one row; also returned alone after activate / deactivate (variable "s", flag "canManage") -->
<tr th:fragment="row" th:id="|customer-${s.id()}|">
    <td class="font-weight-bold" th:text="${s.code()}">SUP-001</td>
    <td th:text="${s.name()}">Acme Industrial Ltd</td>
    <td>
        <div th:text="${s.contactPerson()} ?: '-'">Jane Doe</div>
        <small class="wms-muted" th:if="${s.phone() != null}" th:text="${s.phone()}">+250 788 000 000</small>
    </td>
    <td th:text="${s.email()} ?: '-'">orders@acme.example</td>
    <td th:text="${s.city()} ?: '-'">Kigali</td>
    <td>
        <span class="badge badge-success" th:if="${s.active()}" th:text="#{common.active}">Active</span>
        <span class="badge badge-danger" th:unless="${s.active()}" th:text="#{common.inactive}">Inactive</span>
    </td>
    <td class="text-right text-nowrap">
        <th:block th:if="${canManage}">
            <a class="btn btn-sm btn-light" th:href="@{/customers/{id}/edit(id=${s.id()})}" th:title="#{common.edit}">
                <i class="zmdi zmdi-edit"></i></a>
            <button type="button" class="btn btn-sm btn-danger" th:if="${s.active()}"
                    th:hx-post="@{/customers/{id}/deactivate(id=${s.id()})}"
                    th:hx-confirm="#{customers.confirm.deactivate}"
                    hx-target="closest tr" hx-swap="outerHTML" th:title="#{customers.deactivate}">
                <i class="zmdi zmdi-block"></i></button>
            <button type="button" class="btn btn-sm btn-success" th:unless="${s.active()}"
                    th:hx-post="@{/customers/{id}/activate(id=${s.id()})}"
                    hx-target="closest tr" hx-swap="outerHTML" th:title="#{customers.activate}">
                <i class="zmdi zmdi-check"></i></button>
        </th:block>
    </td>
</tr>

</body>
</html>
