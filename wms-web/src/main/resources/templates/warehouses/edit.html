<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'warehouses')}">
<head><title th:text="#{warehouses.edit.title}">Edit Warehouse</title></head>
<body>

<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <div class="card-title">
                        <span th:text="#{warehouses.edit.title}">Edit Warehouse</span>: <span
                            th:text="${code}">A-01</span>
                    </div>
                    <hr>
                    <th:block th:replace="~{::detailsCard}"></th:block>
                </div>
            </div>
        </div>
    </div>
</th:block>

<div id="details-card" th:fragment="detailsCard">
    <form th:object="${form}" method="post"
          th:action="@{/warehouses/{id}/details(id=${warehouseId})}"
          th:hx-post="@{/warehouses/{id}/details(id=${warehouseId})}"
          hx-target="#details-card" hx-swap="outerHTML">
        <div class="alert alert-success" th:if="${saved}" th:text="#{common.saved}">Saved</div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <div th:replace="~{fragments/form-fields :: input('name', 'warehouses.field.name', 'text', true, 'off')}"></div>
        <div th:replace="~{fragments/form-fields :: input('addressLine', 'warehouses.field.addressLine', 'text', false, 'off')}"></div>
        <div th:replace="~{fragments/form-fields :: input('city', 'warehouses.field.city', 'text', false, 'off')}"></div>
        <div th:replace="~{fragments/form-fields :: input('country', 'warehouses.field.country', 'text', false, 'off')}"></div>

        <button type="submit" class="btn btn-light px-5" th:text="#{warehouses.update}">Update warehouse</button>
        <a class="btn btn-secondary px-4" th:href="@{/warehouses}" th:text="#{common.cancel}">Cancel</a>
    </form>
</div>

</body>
</html>
