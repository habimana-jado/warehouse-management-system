<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'purchase-orders')}">
<head>
    <title th:text="#{inbound.po.title}">Purchase orders</title>
</head>
<body>

<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{inbound.po.title}">Purchase orders</div>
                        <a class="btn btn-light" th:if="${@uiUser.hasAnyRole('ADMIN','WAREHOUSE_MANAGER')}" th:href="@{/purchase-orders/new}">
                            <i class="zmdi zmdi-plus"></i> <span th:text="#{inbound.po.new}">New purchase order</span>
                        </a>
                    </div>
                    <hr>

                    <form id="po-filters" method="get" th:object="${filter}"
                          th:action="@{/purchase-orders}" th:hx-get="@{/purchase-orders}"
                          hx-trigger="input delay:400ms, submit"
                          hx-target="#po-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <div class="position-relative has-icon-right">
                                    <input type="text" class="form-control input-shadow" th:field="*{q}"
                                           th:placeholder="#{inbound.po.search}">
                                    <div class="form-control-position"><i class="icon-magnifier"></i></div>
                                </div>
                            </div>
                            <div class="form-group col-md-3">
                                <select class="form-control" th:field="*{status}">
                                    <option value="" th:text="#{inbound.po.filter.open}">Open orders</option>
                                    <option value="ALL" th:text="#{inbound.po.filter.all}">All statuses</option>
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="#{'po.status.' + ${s}}">Status</option>
                                </select>
                            </div>
                            <div class="form-group col-md-2">
                                <input type="date" class="form-control" th:field="*{orderDateFrom}"
                                       th:title="#{inbound.po.filter.from}">
                            </div>
                            <div class="form-group col-md-2">
                                <input type="date" class="form-control" th:field="*{orderDateTo}"
                                       th:title="#{inbound.po.filter.to}">
                            </div>
                        </div>
                    </form>

                    <div id="po-results" th:fragment="results"
                         hx-target="#po-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['poNumber']}" th:hx-get="${sortUrl['poNumber']}"
                                           th:classappend="${sortClass['poNumber']}" th:text="#{inbound.po.col.number}">PO number</a>
                                    </th>
                                    <th scope="col" th:text="#{inbound.po.col.supplier}">Supplier</th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['status']}" th:hx-get="${sortUrl['status']}"
                                           th:classappend="${sortClass['status']}" th:text="#{inbound.po.col.status}">Status</a>
                                    </th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['orderDate']}" th:hx-get="${sortUrl['orderDate']}"
                                           th:classappend="${sortClass['orderDate']}" th:text="#{inbound.po.col.orderDate}">Order date</a>
                                    </th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['expectedDate']}" th:hx-get="${sortUrl['expectedDate']}"
                                           th:classappend="${sortClass['expectedDate']}" th:text="#{inbound.po.col.expected}">Expected</a>
                                    </th>
                                    <th scope="col" th:text="#{inbound.po.col.lines}">Lines</th>
                                    <th scope="col" th:text="#{inbound.po.col.received}">Received / ordered</th>
                                    <th scope="col"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <th:block th:each="p : ${page.content()}">
                                    <tr th:replace="~{inbound/purchase-orders :: row}"></tr>
                                </th:block>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="8" class="text-center wms-muted" th:text="#{common.noResults}">No results</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}"></small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- row fragment: also returnable alone; uses the loop variable p of its caller -->
<table>
    <tbody>
    <tr th:fragment="row">
        <td th:text="${p.poNumber()}">PO-000001</td>
        <td th:text="${p.supplierName()}">Supplier</td>
        <td><th:block th:replace="~{inbound/fragments :: poStatus(${p.status()})}"></th:block></td>
        <td th:text="${p.orderDate()}">2026-10-01</td>
        <td>
            <span th:text="${p.expectedDate()} ?: '&mdash;'">2026-10-15</span>
            <span class="badge badge-danger ml-1" th:if="${p.overdue()}" th:text="#{inbound.po.overdue}">Overdue</span>
        </td>
        <td th:text="${p.lineCount()}">3</td>
        <td th:text="${@inboundFormat.qty(p.acceptedQty())} + ' / ' + ${@inboundFormat.qty(p.orderedQty())}">0 / 100</td>
        <td class="text-right">
            <a class="btn btn-sm btn-light" th:href="@{/purchase-orders/{id}(id=${p.id()})}">
                <i class="zmdi zmdi-eye"></i> <span th:text="#{inbound.action.view}">View</span>
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
