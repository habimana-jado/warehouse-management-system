<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, ${menu})}">
<head>
    <title th:text="#{inbound.return.new}">New customer return</title>
</head>
<body>

<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="card-title" th:text="#{inbound.return.new}">New customer return</div>
                    <hr>
                    <form id="return-form" method="post" th:object="${form}" th:action="@{/customer-returns}">

                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</p>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for="customerId" th:text="#{inbound.return.form.customer}">Customer</label>
                                <select id="customerId" class="form-control" th:field="*{customerId}" th:errorclass="is-invalid">
                                    <option value="" th:text="#{inbound.return.form.customer.none}">No customer</option>
                                    <option th:each="c : ${customers}" th:value="${c.id()}"
                                            th:text="${c.code()} + ' - ' + ${c.name()}">CUS-1 - Customer</option>
                                </select>
                            </div>
                            <div class="form-group col-md-3">
                                <label for="salesOrderNumber" th:text="#{inbound.return.form.salesOrder}">Sales order number</label>
                                <input id="salesOrderNumber" type="text" maxlength="50" class="form-control"
                                       th:field="*{salesOrderNumber}" th:errorclass="is-invalid">
                            </div>
                            <div class="form-group col-md-5">
                                <label for="notes" th:text="#{inbound.return.form.notes}">Notes</label>
                                <input id="notes" type="text" maxlength="1000" class="form-control" th:field="*{notes}"
                                       th:errorclass="is-invalid">
                            </div>
                        </div>

                        <div th:replace="~{inbound/customer-return-form :: linesCard}"></div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-light px-5" th:text="#{inbound.return.form.save}">Register return</button>
                            <a class="btn btn-secondary" th:href="@{/customer-returns}" th:text="#{inbound.action.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- The repeating lines. Swapped as a whole by the add and remove buttons (th:object makes it work on its own). -->
<div id="return-lines" th:fragment="linesCard" th:object="${form}">
    <div class="d-flex justify-content-between align-items-center">
        <h6 class="mb-0" th:text="#{inbound.return.form.lines}">Items coming back</h6>
        <button type="button" class="btn btn-sm btn-light"
                th:hx-post="@{/customer-returns/lines/add}"
                hx-target="#return-lines" hx-swap="outerHTML">
            <i class="zmdi zmdi-plus"></i> <span th:text="#{inbound.return.form.addLine}">Add line</span>
        </button>
    </div>
    <small class="wms-muted" th:text="#{inbound.return.form.help}">A serial item needs one line per unit.</small>
    <datalist id="item-options"></datalist>
    <div class="alert alert-danger mt-2" th:if="${#fields.hasErrors('lines')}" th:errors="*{lines}">Error</div>
    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{inbound.line.col.itemInput}">Item</th>
                <th scope="col" th:text="#{inbound.line.col.qty}">Quantity</th>
                <th scope="col" th:text="#{inbound.line.col.unit}">Unit</th>
                <th scope="col" th:text="#{inbound.receive.col.lot}">Lot</th>
                <th scope="col" th:text="#{inbound.receive.col.expiry}">Expiry</th>
                <th scope="col" th:text="#{inbound.receive.col.serial}">Serial</th>
                <th scope="col" th:text="#{inbound.return.line.col.reason}">Return reason</th>
                <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line, i : *{lines}">
                <td>
                    <input type="text" class="form-control" th:field="*{lines[__${i.index}__].item}" list="item-options"
                           th:errorclass="is-invalid" autocomplete="off"
                           th:attr="hx-get=@{/lookup/items}" hx-trigger="input changed delay:300ms"
                           hx-target="#item-options" hx-swap="innerHTML">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lines[__${i.index}__].item')}"
                         th:errors="*{lines[__${i.index}__].item}">Error</div>
                </td>
                <td>
                    <input type="number" step="any" min="0" class="form-control"
                           th:field="*{lines[__${i.index}__].quantity}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lines[__${i.index}__].quantity')}"
                         th:errors="*{lines[__${i.index}__].quantity}">Error</div>
                </td>
                <td><input type="text" maxlength="30" class="form-control" th:field="*{lines[__${i.index}__].uom}"
                           autocomplete="off"></td>
                <td><input type="text" maxlength="100" class="form-control" th:field="*{lines[__${i.index}__].lotNumber}"
                           autocomplete="off"></td>
                <td><input type="date" class="form-control" th:field="*{lines[__${i.index}__].expiryDate}"></td>
                <td><input type="text" maxlength="100" class="form-control" th:field="*{lines[__${i.index}__].serialNumber}"
                           autocomplete="off"></td>
                <td><input type="text" maxlength="500" class="form-control" th:field="*{lines[__${i.index}__].returnReason}"
                           autocomplete="off"></td>
                <td>
                    <button type="button" class="btn btn-sm btn-danger" th:if="${#lists.size(form.lines) > 1}"
                            th:hx-post="@{/customer-returns/lines/remove(index=${i.index})}"
                            hx-target="#return-lines" hx-swap="outerHTML">
                        <i class="zmdi zmdi-delete"></i>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
