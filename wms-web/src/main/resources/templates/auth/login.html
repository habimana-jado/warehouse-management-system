<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: layout(~{::title}, ~{::content})}">
<head><title th:text="#{login.title}">Sign In</title></head>
<body>
<th:block th:fragment="content">
    <div class="card card-authentication1 mx-auto my-5">
        <div class="card-body">
            <div class="card-content p-2">
                <div class="text-center"><img th:src="@{/assets/images/logo-icon.png}" alt="logo"></div>
                <div class="card-title text-uppercase text-center py-3" th:text="#{login.title}">Sign In</div>

                <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}">Invalid credentials
                </div>
                <div class="alert alert-info" th:if="${param.logout}" th:text="#{login.loggedOut}">Signed out</div>

                <form th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label for="username" class="sr-only" th:text="#{users.field.username}">Username</label>
                        <div class="position-relative has-icon-right">
                            <input type="text" id="username" name="username" class="form-control input-shadow"
                                   th:placeholder="#{users.field.username}" autocomplete="username" required autofocus>
                            <div class="form-control-position"><i class="icon-user"></i></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password" class="sr-only" th:text="#{users.field.password}">Password</label>
                        <div class="position-relative has-icon-right">
                            <input type="password" id="password" name="password" class="form-control input-shadow"
                                   th:placeholder="#{users.field.password}" autocomplete="current-password" required>
                            <div class="form-control-position"><i class="icon-lock"></i></div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-light btn-block" th:text="#{login.submit}">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
