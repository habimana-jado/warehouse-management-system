<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, ${menu})}">
<head>
    <title th:text="${editing} ? #{so.edit.title(${soNumber})} : #{so.new}">New sales order</title>
</head>
<body>

<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="card-title"
                         th:text="${editing} ? #{so.edit.title(${soNumber})} : #{so.new}">New sales order</div>
                    <hr>
                    <form id="so-form" method="post" th:object="${form}"
                          th:action="${editing} ? @{/sales-orders/{id}/update(id=${soId})} : @{/sales-orders}">

                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</p>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-4" th:unless="${editing}">
                                <label for="customerId" th:text="#{so.form.customer}">Customer</label>
                                <select id="customerId" class="form-control" th:field="*{customerId}" th:errorclass="is-invalid">
                                    <option value="" th:text="#{outbound.action.select}">Select...</option>
                                    <option th:each="c : ${customers}" th:value="${c.id()}"
                                            th:text="${c.code()} + ' - ' + ${c.name()}">CUS-1 - Customer</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('customerId')}"
                                     th:errors="*{customerId}">Error</div>
                            </div>
                            <div class="form-group col-md-4" th:if="${editing}">
                                <label th:text="#{so.form.customer}">Customer</label>
                                <input type="text" class="form-control" readonly th:value="${customerName}">
                            </div>
                            <div class="form-group col-md-2">
                                <label for="orderDate" th:text="#{so.form.orderDate}">Order date</label>
                                <input id="orderDate" type="date" class="form-control" th:field="*{orderDate}"
                                       th:errorclass="is-invalid">
                            </div>
                            <div class="form-group col-md-2">
                                <label for="requiredDate" th:text="#{so.form.required}">Required date</label>
                                <input id="requiredDate" type="date" class="form-control" th:field="*{requiredDate}"
                                       th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('requiredDate')}"
                                     th:errors="*{requiredDate}">Error</div>
                            </div>
                            <div class="form-group col-md-2">
                                <label for="currency" th:text="#{so.form.currency}">Currency</label>
                                <input id="currency" type="text" maxlength="3" class="form-control" th:field="*{currency}"
                                       th:errorclass="is-invalid" autocomplete="off">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('currency')}"
                                     th:errors="*{currency}">Error</div>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for="customerReference" th:text="#{so.form.customerRef}">Customer reference</label>
                                <input id="customerReference" type="text" maxlength="60" class="form-control"
                                       th:field="*{customerReference}" th:errorclass="is-invalid">
                            </div>
                            <div class="form-group col-md-8">
                                <label for="notes" th:text="#{so.form.notes}">Notes</label>
                                <input id="notes" type="text" maxlength="1000" class="form-control" th:field="*{notes}"
                                       th:errorclass="is-invalid">
                            </div>
                        </div>

                        <div th:replace="~{outbound/sales-order-form :: linesCard}"></div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-light px-5" th:text="#{so.form.save}">Save draft</button>
                            <a class="btn btn-secondary"
                               th:href="${editing} ? @{/sales-orders/{id}(id=${soId})} : @{/sales-orders}"
                               th:text="#{outbound.action.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- The repeating lines. Swapped as a whole by the add and remove buttons (th:object makes it work on its own). -->
<div id="so-lines" th:fragment="linesCard" th:object="${form}">
    <div class="d-flex justify-content-between align-items-center">
        <h6 class="mb-0" th:text="#{so.form.lines}">Lines</h6>
        <button type="button" class="btn btn-sm btn-light"
                th:hx-post="@{/sales-orders/lines/add}"
                hx-target="#so-lines" hx-swap="outerHTML">
            <i class="zmdi zmdi-plus"></i> <span th:text="#{so.form.addLine}">Add line</span>
        </button>
    </div>
    <small class="wms-muted" th:text="#{so.form.help}">One line per item. Leave Unit empty to use the base unit.</small>
    <datalist id="item-options"></datalist>
    <div class="alert alert-danger mt-2" th:if="${#fields.hasErrors('lines')}" th:errors="*{lines}">Error</div>
    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th scope="col" th:text="#{so.line.col.itemInput}">Item</th>
                <th scope="col" th:text="#{so.line.col.qty}">Quantity</th>
                <th scope="col" th:text="#{so.line.col.unit}">Unit</th>
                <th scope="col" th:text="#{so.line.col.price}">Unit price</th>
                <th scope="col" th:text="#{so.line.col.notes}">Notes</th>
                <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line, i : *{lines}">
                <td>
                    <input type="text" class="form-control" th:field="*{lines[__${i.index}__].item}" list="item-options"
                           th:errorclass="is-invalid" autocomplete="off"
                           th:attr="hx-get=@{/lookup/items}" hx-trigger="input changed delay:300ms"
                           hx-target="#item-options" hx-swap="innerHTML">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lines[__${i.index}__].item')}"
                         th:errors="*{lines[__${i.index}__].item}">Error</div>
                </td>
                <td>
                    <input type="number" step="any" min="0" class="form-control"
                           th:field="*{lines[__${i.index}__].quantity}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lines[__${i.index}__].quantity')}"
                         th:errors="*{lines[__${i.index}__].quantity}">Error</div>
                </td>
                <td><input type="text" maxlength="30" class="form-control" th:field="*{lines[__${i.index}__].uom}"
                           autocomplete="off"></td>
                <td>
                    <input type="number" step="any" min="0" class="form-control"
                           th:field="*{lines[__${i.index}__].unitPrice}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lines[__${i.index}__].unitPrice')}"
                         th:errors="*{lines[__${i.index}__].unitPrice}">Error</div>
                </td>
                <td><input type="text" maxlength="255" class="form-control" th:field="*{lines[__${i.index}__].note}"
                           autocomplete="off"></td>
                <td>
                    <button type="button" class="btn btn-sm btn-danger" th:if="${#lists.size(form.lines) > 1}"
                            th:hx-post="@{/sales-orders/lines/remove(index=${i.index})}"
                            hx-target="#so-lines" hx-swap="outerHTML">
                        <i class="zmdi zmdi-delete"></i>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
