<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'shipments')}">
<head>
    <title th:text="#{shipment.title}">Shipments</title>
</head>
<body>

<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="card-title mb-0" th:text="#{shipment.title}">Shipments</div>
                    <hr>

                    <form id="shipment-filters" method="get" th:object="${filter}"
                          th:action="@{/shipments}" th:hx-get="@{/shipments}"
                          hx-trigger="input delay:400ms, submit"
                          hx-target="#shipment-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <div class="position-relative has-icon-right">
                                    <input type="text" class="form-control input-shadow" th:field="*{q}"
                                           th:placeholder="#{shipment.search}">
                                    <div class="form-control-position"><i class="icon-magnifier"></i></div>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="shipment-results" th:fragment="results"
                         hx-target="#shipment-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['shipmentNumber']}" th:hx-get="${sortUrl['shipmentNumber']}"
                                           th:classappend="${sortClass['shipmentNumber']}" th:text="#{shipment.col.number}">Delivery note</a>
                                    </th>
                                    <th scope="col" th:text="#{shipment.col.order}">Sales order</th>
                                    <th scope="col" th:text="#{shipment.col.customer}">Customer</th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['status']}" th:hx-get="${sortUrl['status']}"
                                           th:classappend="${sortClass['status']}" th:text="#{shipment.col.status}">Status</a>
                                    </th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['shippedAt']}" th:hx-get="${sortUrl['shippedAt']}"
                                           th:classappend="${sortClass['shippedAt']}" th:text="#{shipment.col.shipped}">Shipped</a>
                                    </th>
                                    <th scope="col" class="text-right" th:text="#{shipment.col.packages}">Packages</th>
                                    <th scope="col" class="text-right" th:text="#{shipment.col.lines}">Lines</th>
                                    <th scope="col"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <th:block th:each="s : ${page.content()}">
                                    <tr th:replace="~{outbound/shipments :: row}"></tr>
                                </th:block>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="8" class="text-center wms-muted" th:text="#{common.noResults}">No results</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}"></small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- row fragment: also returnable alone; uses the loop variable s of its caller -->
<table>
    <tbody>
    <tr th:fragment="row">
        <td th:text="${s.shipmentNumber()}">DN-000001</td>
        <td th:text="${s.orderNumber()}">SO-000001</td>
        <td th:text="${s.customerName()}">Customer</td>
        <td><th:block th:replace="~{outbound/fragments :: shipmentStatus(${s.status()})}"></th:block></td>
        <td th:text="${@uiFormat.dateTime(s.shippedAt())}">date</td>
        <td class="text-right" th:text="${s.packageCount()} ?: '&mdash;'">2</td>
        <td class="text-right" th:text="${s.lineCount()}">3</td>
        <td class="text-right">
            <a class="btn btn-sm btn-light" th:href="@{/shipments/{id}(id=${s.id()})}">
                <i class="zmdi zmdi-eye"></i> <span th:text="#{outbound.action.view}">View</span>
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
