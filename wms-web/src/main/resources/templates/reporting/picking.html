<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'reports')}">
<head>
    <title th:text="#{reporting.picking.title}">Picking</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{reporting.picking.title}">Picking</div>
                        <a class="btn btn-sm btn-secondary" th:href="@{/reports}">
                            <i class="zmdi zmdi-arrow-left"></i> <span th:text="#{reporting.back}">All reports</span>
                        </a>
                    </div>
                    <hr>
                    <p class="wms-muted" th:text="#{reporting.picking.hint}"></p>

                    <form id="picking-filters" method="get" th:action="@{/reports/outbound/picking}"
                          th:object="${filter}" th:hx-get="@{/reports/outbound/picking}"
                          hx-trigger="change, submit" hx-target="#picking-results" hx-swap="outerHTML"
                          hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label for="from" th:text="#{reporting.range.from}">From</label>
                                <input type="date" class="form-control" th:field="*{from}">
                            </div>
                            <div class="form-group col-md-3">
                                <label for="to" th:text="#{reporting.range.to}">To (included)</label>
                                <input type="date" class="form-control" th:field="*{to}">
                            </div>
                        </div>
                    </form>

                    <div id="picking-results" th:fragment="results" hx-target="#picking-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
                        <th:block th:if="${error == null}">
                            <p>
                                <small class="wms-muted"
                                       th:text="#{reporting.picking.range(${@repFormat.date(report.from())}, ${@repFormat.date(report.toExclusive().minusDays(1))})}"></small>
                            </p>
                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <div class="wms-muted" th:text="#{reporting.picking.lists}">Pick lists completed</div>
                                    <h5 th:text="${report.completedPickLists()}">0</h5>
                                </div>
                                <div class="col-md-3">
                                    <div class="wms-muted" th:text="#{reporting.picking.cycle}">Average time per list</div>
                                    <h5 th:text="${@repFormat.duration(report.avgCycleSeconds())}">0 min</h5>
                                </div>
                                <div class="col-md-3">
                                    <div class="wms-muted" th:text="#{reporting.picking.lines}">Lines picked</div>
                                    <h5 th:text="${report.lines()}">0</h5>
                                </div>
                                <div class="col-md-3">
                                    <div class="wms-muted" th:text="#{reporting.picking.shortRate}">Short-pick rate</div>
                                    <h5 th:text="${@repFormat.percent(report.shortLineRate())}">0 %</h5>
                                    <small class="wms-muted"
                                           th:text="${report.shortLines() + ' / ' + report.lines()}"></small>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <div class="wms-muted" th:text="#{reporting.picking.planned}">Planned quantity</div>
                                    <h5 th:text="${@repFormat.qty(report.plannedQty())}">0</h5>
                                </div>
                                <div class="col-md-3">
                                    <div class="wms-muted" th:text="#{reporting.picking.picked}">Picked quantity</div>
                                    <h5 th:text="${@repFormat.qty(report.pickedQty())}">0</h5>
                                </div>
                                <div class="col-md-3">
                                    <div class="wms-muted" th:text="#{reporting.picking.short}">Short quantity</div>
                                    <h5 th:text="${@repFormat.qty(report.shortQty())}">0</h5>
                                </div>
                            </div>
                            <small class="wms-muted" th:text="#{reporting.picking.unitsNote}"></small>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
