<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'reports')}">
<head>
    <title th:text="#{reporting.openDemand.title}">Open demand</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{reporting.openDemand.title}">Open demand</div>
                        <a class="btn btn-sm btn-secondary" th:href="@{/reports}">
                            <i class="zmdi zmdi-arrow-left"></i> <span th:text="#{reporting.back}">All reports</span>
                        </a>
                    </div>
                    <hr>
                    <p class="wms-muted" th:text="#{reporting.openDemand.hint}"></p>

                    <form id="demand-filters" method="get" th:action="@{/reports/outbound/open-demand}"
                          th:object="${filter}" th:hx-get="@{/reports/outbound/open-demand}"
                          hx-trigger="input delay:400ms, submit" hx-target="#demand-results" hx-swap="outerHTML"
                          hx-push-url="true">
                        <div class="form-group">
                            <div class="icheck-material-white">
                                <input type="checkbox" th:field="*{shortfallOnly}">
                                <label th:for="${#ids.prev('shortfallOnly')}"
                                       th:text="#{reporting.openDemand.shortfallOnly}">Only items with a shortfall</label>
                            </div>
                        </div>
                    </form>

                    <div id="demand-results" th:fragment="results" hx-target="#demand-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col" th:text="#{reporting.col.sku}">SKU</th>
                                    <th scope="col" th:text="#{reporting.col.item}">Item</th>
                                    <th scope="col" th:text="#{reporting.col.uom}">Unit</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.orderLines}">Order lines</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.toPick}">To pick</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.availableStorage}">In storage</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.shortfall}">Shortfall</th>
                                    <th scope="col" th:text="#{reporting.col.earliestRequired}">Earliest required</th>
                                    <th scope="col"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="9" class="text-center wms-muted" th:text="#{common.noResults}">No results</td>
                                </tr>
                                <tr th:each="r : ${page.content()}">
                                    <td th:text="${r.itemSku()}">SKU</td>
                                    <td th:text="${r.itemName()}">Item</td>
                                    <td th:text="${r.baseUom()}">pcs</td>
                                    <td class="text-right" th:text="${r.openOrderLines()}">0</td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.toPickQty())}">0</td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.availableInStorage())}">0</td>
                                    <td class="text-right">
                                        <span class="badge badge-danger" th:if="${r.shortfallQty().signum() > 0}"
                                              th:text="${@repFormat.qty(r.shortfallQty())}">5</span>
                                        <span th:if="${r.shortfallQty().signum() == 0}">0</span>
                                    </td>
                                    <td th:text="${@repFormat.date(r.earliestRequiredDate())}">2026-10-30</td>
                                    <td class="text-right">
                                        <a class="btn btn-sm btn-light" th:if="${r.itemSku() != null}"
                                           th:href="@{/stock(item=${r.itemSku()})}">
                                            <i class="zmdi zmdi-eye"></i> <span th:text="#{reporting.view}">View</span>
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}"></small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
