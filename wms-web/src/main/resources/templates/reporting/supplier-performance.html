<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'reports')}">
<head>
    <title th:text="#{reporting.supplierPerf.title}">Supplier performance</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{reporting.supplierPerf.title}">Supplier performance</div>
                        <a class="btn btn-sm btn-secondary" th:href="@{/reports}">
                            <i class="zmdi zmdi-arrow-left"></i> <span th:text="#{reporting.back}">All reports</span>
                        </a>
                    </div>
                    <hr>
                    <p class="wms-muted" th:text="#{reporting.supplierPerf.hint}"></p>

                    <form id="supplierperf-filters" method="get" th:action="@{/reports/inbound/supplier-performance}"
                          th:object="${filter}" th:hx-get="@{/reports/inbound/supplier-performance}"
                          hx-trigger="change, submit" hx-target="#supplierperf-results" hx-swap="outerHTML"
                          hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label for="from" th:text="#{reporting.range.from}">From</label>
                                <input type="date" class="form-control" th:field="*{from}">
                            </div>
                            <div class="form-group col-md-3">
                                <label for="to" th:text="#{reporting.range.to}">To (included)</label>
                                <input type="date" class="form-control" th:field="*{to}">
                            </div>
                        </div>
                    </form>

                    <div id="supplierperf-results" th:fragment="results" hx-target="#supplierperf-results"
                         hx-swap="outerHTML" hx-push-url="true">
                        <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
                        <p th:if="${report.from() != null}">
                            <small class="wms-muted"
                                   th:text="#{reporting.supplierPerf.range(${@repFormat.date(report.from())}, ${@repFormat.date(report.toExclusive().minusDays(1))})}"></small>
                        </p>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col" th:text="#{reporting.col.supplier}">Supplier</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.orders}">Orders</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.lineFill}">Line fill rate</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.qtyFill}">Quantity fill rate</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.rejectRate}">Reject rate</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.onTime}">On time</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${report.rows().isEmpty()}">
                                    <td colspan="6" class="text-center wms-muted" th:text="#{common.noResults}">No results</td>
                                </tr>
                                <tr th:each="r : ${report.rows()}">
                                    <td>
                                        <span th:text="${r.supplierName()}">Supplier</span>
                                        <small class="wms-muted" th:if="${r.supplierCode() != null}"
                                               th:text="${r.supplierCode()}">CODE</small>
                                    </td>
                                    <td class="text-right" th:text="${r.purchaseOrders()}">0</td>
                                    <td class="text-right">
                                        <span th:text="${@repFormat.percent(r.lineFillRate())}">0 %</span>
                                        <small class="wms-muted" th:text="${'(' + r.linesFulfilled() + ' / ' + r.lines() + ')'}"></small>
                                    </td>
                                    <td class="text-right" th:text="${@repFormat.percent(r.qtyFillRate())}">0 %</td>
                                    <td class="text-right" th:text="${@repFormat.percent(r.rejectRate())}">0 %</td>
                                    <td class="text-right">
                                        <span th:text="${@repFormat.percent(r.onTimeRate())}">0 %</span>
                                        <small class="wms-muted" th:text="${'(' + r.onTimeOrders() + ' / ' + r.datedOrdersReceived() + ')'}"></small>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
