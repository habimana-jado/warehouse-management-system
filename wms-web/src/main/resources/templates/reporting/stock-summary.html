<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'reports')}">
<head>
    <title th:text="#{reporting.stock.title}">Stock on hand</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{reporting.stock.title}">Stock on hand</div>
                        <a class="btn btn-sm btn-secondary" th:href="@{/reports}">
                            <i class="zmdi zmdi-arrow-left"></i> <span th:text="#{reporting.back}">All reports</span>
                        </a>
                    </div>
                    <hr>
                    <p class="wms-muted" th:text="#{reporting.stock.hint}"></p>

                    <form id="stock-filters" method="get" th:action="@{/reports/stock}" th:hx-get="@{/reports/stock}"
                          hx-trigger="input delay:400ms, submit" hx-target="#stock-results" hx-swap="outerHTML"
                          hx-push-url="true">
                        <div class="form-group position-relative has-icon-right">
                            <input type="text" name="q" class="form-control input-shadow" th:value="${filter.q}"
                                   th:placeholder="#{reporting.search.item}">
                            <div class="form-control-position"><i class="icon-magnifier"></i></div>
                        </div>
                    </form>

                    <div id="stock-results" th:fragment="results" hx-target="#stock-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col" th:text="#{reporting.col.sku}">SKU</th>
                                    <th scope="col" th:text="#{reporting.col.item}">Item</th>
                                    <th scope="col" th:text="#{reporting.col.uom}">Unit</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.onHand}">On hand</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.storage}">Storage</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.receiving}">Receiving</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.damaged}">Damaged</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.other}">Other</th>
                                    <th scope="col"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="9" class="text-center wms-muted" th:text="#{common.noResults}">No results</td>
                                </tr>
                                <tr th:each="r : ${page.content()}">
                                    <td th:text="${r.itemSku()}">SKU</td>
                                    <td th:text="${r.itemName()}">Item</td>
                                    <td th:text="${r.baseUom()}">pcs</td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.onHand())}">0</td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.storageQty())}">0</td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.receivingQty())}">0</td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.damagedQty())}">0</td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.otherQty())}">0</td>
                                    <td class="text-right">
                                        <a class="btn btn-sm btn-light" th:if="${r.itemSku() != null}"
                                           th:href="@{/stock(item=${r.itemSku()})}" hx-boost="false">
                                            <i class="zmdi zmdi-eye"></i> <span th:text="#{reporting.view}">View</span>
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}"></small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
