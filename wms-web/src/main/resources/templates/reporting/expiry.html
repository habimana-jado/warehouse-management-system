<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'reports')}">
<head>
    <title th:text="#{reporting.expiry.title}">Expiry</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{reporting.expiry.title}">Expiry</div>
                        <a class="btn btn-sm btn-secondary" th:href="@{/reports}">
                            <i class="zmdi zmdi-arrow-left"></i> <span th:text="#{reporting.back}">All reports</span>
                        </a>
                    </div>
                    <hr>
                    <p class="wms-muted" th:text="#{reporting.expiry.hint}"></p>

                    <form id="expiry-filters" method="get" th:action="@{/reports/expiry}" th:object="${filter}"
                          th:hx-get="@{/reports/expiry}" hx-trigger="input delay:400ms, submit"
                          hx-target="#expiry-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label for="days" th:text="#{reporting.expiry.days}">Expiring within (days)</label>
                                <input type="number" min="0" max="3650" class="form-control" th:field="*{days}"
                                       th:placeholder="#{reporting.expiry.days.placeholder}">
                            </div>
                            <div class="form-group col-md-4 align-self-end">
                                <div class="icheck-material-white">
                                    <input type="checkbox" th:field="*{includeExpired}">
                                    <label th:for="${#ids.prev('includeExpired')}"
                                           th:text="#{reporting.expiry.includeExpired}">Include already expired</label>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="expiry-results" th:fragment="results" hx-target="#expiry-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col" th:text="#{reporting.col.sku}">SKU</th>
                                    <th scope="col" th:text="#{reporting.col.item}">Item</th>
                                    <th scope="col" th:text="#{reporting.col.lot}">Lot</th>
                                    <th scope="col" th:text="#{reporting.col.expiryDate}">Expiry date</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.daysLeft}">Days left</th>
                                    <th scope="col" th:text="#{reporting.col.status}">Status</th>
                                    <th scope="col" th:text="#{reporting.col.bin}">Bin</th>
                                    <th scope="col" th:text="#{reporting.col.usage}">Usage</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.quantity}">Quantity</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="9" class="text-center wms-muted" th:text="#{common.noResults}">No results</td>
                                </tr>
                                <tr th:each="r : ${page.content()}">
                                    <td th:text="${r.itemSku()}">SKU</td>
                                    <td th:text="${r.itemName()}">Item</td>
                                    <td th:text="${r.lotNumber()}">LOT</td>
                                    <td th:text="${@repFormat.date(r.expiryDate())}">2026-12-31</td>
                                    <td class="text-right" th:text="${r.daysToExpiry()}">10</td>
                                    <td><span th:replace="~{reporting/fragments :: expiryStatus(${r.status().name()})}"></span></td>
                                    <td th:text="${r.locationCode()}">A-01</td>
                                    <td>
                                        <span th:if="${r.locationUsage() != null}"
                                              th:text="#{'reporting.usage.' + ${r.locationUsage().name()}}">Storage</span>
                                    </td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.quantity())}">0</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}"></small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
