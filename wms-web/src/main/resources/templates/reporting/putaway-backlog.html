<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'reports')}">
<head>
    <title th:text="#{reporting.putawayBacklog.title}">Put-away backlog</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{reporting.putawayBacklog.title}">Put-away backlog</div>
                        <a class="btn btn-sm btn-secondary" th:href="@{/reports}">
                            <i class="zmdi zmdi-arrow-left"></i> <span th:text="#{reporting.back}">All reports</span>
                        </a>
                    </div>
                    <hr>
                    <p class="wms-muted" th:text="#{reporting.putawayBacklog.hint}"></p>

                    <div class="row mb-3">
                        <div class="col-md-3">
                            <div class="wms-muted" th:text="#{reporting.putawayBacklog.pending}">Lines waiting</div>
                            <h5 th:text="${report.pendingLines()}">0</h5>
                        </div>
                        <div class="col-md-4">
                            <div class="wms-muted" th:text="#{reporting.putawayBacklog.oldest}">Oldest receipt waiting since</div>
                            <h5 th:text="${@uiFormat.dateTime(report.oldestReceivedAt())}">date</h5>
                        </div>
                    </div>

                    <div id="putaway-results" th:fragment="results" hx-target="#putaway-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col" th:text="#{reporting.col.receipt}">Receipt</th>
                                    <th scope="col" th:text="#{reporting.col.receivedAt}">Received</th>
                                    <th scope="col" th:text="#{reporting.col.waiting}">Waiting</th>
                                    <th scope="col" th:text="#{reporting.col.sku}">SKU</th>
                                    <th scope="col" th:text="#{reporting.col.item}">Item</th>
                                    <th scope="col" class="text-right" th:text="#{reporting.col.quantity}">Quantity</th>
                                    <th scope="col" th:text="#{reporting.col.suggestedBin}">Suggested bin</th>
                                    <th scope="col"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="8" class="text-center wms-muted" th:text="#{common.noResults}">No results</td>
                                </tr>
                                <tr th:each="r : ${page.content()}">
                                    <td th:text="${r.receiptNumber()}">GRN-000001</td>
                                    <td th:text="${@uiFormat.dateTime(r.receivedAt())}">date</td>
                                    <td th:text="${@repFormat.hours(r.ageHours())}">5 h</td>
                                    <td th:text="${r.itemSku()}">SKU</td>
                                    <td th:text="${r.itemName()}">Item</td>
                                    <td class="text-right" th:text="${@repFormat.qty(r.acceptedQty())}">0</td>
                                    <td th:text="${r.suggestedLocationCode()}">A-01</td>
                                    <td class="text-right">
                                        <a class="btn btn-sm btn-light"
                                           th:href="@{/goods-receipts/{id}(id=${r.receiptId()})}">
                                            <i class="zmdi zmdi-eye"></i> <span th:text="#{reporting.view}">View</span>
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}"></small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
