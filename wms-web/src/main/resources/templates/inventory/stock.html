<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'stock')}">
<head>
    <title th:text="#{inventory.stock.title}">Stock on hand</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="card-title" th:text="#{inventory.stock.title}">Stock on hand</div>
                    <hr>
                    <form id="stock-filters" method="get" th:action="@{/stock}" th:object="${filter}"
                          th:hx-get="@{/stock}" hx-trigger="input[target.name != 'item'] delay:400ms, change, submit"
                          hx-target="#stock-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label for="stock-bin" th:text="#{inventory.filter.bin}">Bin</label>
                                <select id="stock-bin" class="form-control" th:field="*{locationId}">
                                    <option value="" th:text="#{inventory.filter.allBins}">All bins</option>
                                    <option th:each="b : ${bins}" th:value="${b.id()}"
                                            th:text="${b.code()} + ' (' + #{'inventory.usage.' + ${b.usage()}} + ')'">
                                        A-01
                                    </option>
                                </select>
                            </div>
                            <div class="form-group col-md-3">
                                <label for="stock-item" th:text="#{inventory.filter.item}">Item</label>
                                <input id="stock-item" type="text" class="form-control" th:field="*{item}"
                                       list="item-options" autocomplete="off"
                                       th:placeholder="#{inventory.filter.item.hint}"
                                       th:attr="hx-get=@{/lookup/items}" hx-trigger="input changed delay:300ms"
                                       hx-target="#item-options" hx-swap="innerHTML" hx-push-url="false">
                                <datalist id="item-options"></datalist>
                            </div>
                            <div class="form-group col-md-3">
                                <label for="stock-serial" th:text="#{inventory.filter.serial}">Serial number</label>
                                <input id="stock-serial" type="text" class="form-control" th:field="*{serial}"
                                       autocomplete="off">
                            </div>
                            <div class="form-group col-md-3 d-flex align-items-end">
                                <div class="icheck-material-white">
                                    <input type="checkbox" th:field="*{includeZero}">
                                    <label th:for="${#ids.prev('includeZero')}"
                                           th:text="#{inventory.filter.includeZero}">Include empty rows</label>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div id="stock-results" th:fragment="results" hx-target="#stock-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="alert alert-info" th:if="${itemProblem}" th:text="#{${itemProblem}(${itemProblemArg})}">Problem</div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col" th:text="#{inventory.stock.bin}">Bin</th>
                                    <th scope="col" th:text="#{inventory.stock.item}">Item</th>
                                    <th scope="col" th:text="#{inventory.stock.lot}">Lot</th>
                                    <th scope="col" th:text="#{inventory.stock.expiry}">Expiry</th>
                                    <th scope="col" th:text="#{inventory.stock.serial}">Serial</th>
                                    <th scope="col" class="text-right">
                                        <a class="wms-sort" th:href="${sortUrl['quantity']}"
                                           th:hx-get="${sortUrl['quantity']}"
                                           th:classappend="${sortClass['quantity']}"
                                           th:text="#{inventory.stock.quantity}">Quantity</a>
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="s : ${page.content()}">
                                    <td>
                                        <a th:href="@{/stock(locationId=${s.locationId()})}"
                                           th:text="${s.locationCode()}">A-01</a>
                                        <span class="badge badge-dark"
                                              th:text="#{'inventory.usage.' + ${s.locationUsage()}}">Storage</span>
                                    </td>
                                    <td><span th:text="${s.itemSku()}">SKU</span> <span class="wms-muted"
                                                                                        th:text="${s.itemName()}">Name</span>
                                    </td>
                                    <td th:text="${s.lotNumber()}"></td>
                                    <td th:text="${@invFormat.date(s.expiryDate())}"></td>
                                    <td th:text="${s.serialNumber()}"></td>
                                    <td class="text-right">
                                        <strong th:text="${@invFormat.qty(s.quantity())}">0</strong>
                                        <span class="wms-muted" th:text="${s.baseUom()}">pcs</span>
                                    </td>
                                </tr>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="6" class="text-center wms-muted" th:text="#{common.noResults}">No
                                        results
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}">Showing</small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
