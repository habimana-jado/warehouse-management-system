<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, ${menu})}">
<head>
    <title th:text="${mine} ? #{inventory.adjustments.mine} : #{inventory.adjustments.title}">Adjustments</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0"
                             th:text="${mine} ? #{inventory.adjustments.mine} : #{inventory.adjustments.title}">
                            Adjustments
                        </div>
                        <a class="btn btn-light btn-sm" th:href="@{/adjustments/new}"
                           th:if="${@uiUser.isAdmin() or @uiUser.hasRole('WAREHOUSE_MANAGER') or @uiUser.hasRole('RECEIVER') or @uiUser.hasRole('PICKER')}">
                            <i class="zmdi zmdi-plus"></i> <span
                                th:text="#{inventory.adjustment.new}">New adjustment</span>
                        </a>
                    </div>
                    <hr>
                    <form id="adjustments-filters" method="get" th:action="@{${listPath}}" th:object="${filter}"
                          th:hx-get="@{${listPath}}" hx-trigger="input delay:400ms, change, submit"
                          hx-target="#adjustments-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <div class="position-relative has-icon-right">
                                    <input type="text" class="form-control input-shadow" th:field="*{q}"
                                           autocomplete="off"
                                           th:placeholder="#{inventory.adjustments.search}">
                                    <div class="form-control-position"><i class="icon-magnifier"></i></div>
                                </div>
                            </div>
                            <div class="form-group col-md-3">
                                <select class="form-control" th:field="*{status}">
                                    <option value="" th:text="#{inventory.filter.allStatuses}">All statuses</option>
                                    <option th:each="s : ${statuses}" th:value="${s}"
                                            th:text="#{'inventory.adjustment.status.' + ${s}}">Status
                                    </option>
                                </select>
                            </div>
                        </div>
                    </form>

                    <div id="adjustments-results" th:fragment="results" hx-target="#adjustments-results"
                         hx-swap="outerHTML" hx-push-url="true">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['adjustmentNumber']}"
                                           th:hx-get="${sortUrl['adjustmentNumber']}"
                                           th:classappend="${sortClass['adjustmentNumber']}"
                                           th:text="#{inventory.adjustment.number}">Number</a>
                                    </th>
                                    <th scope="col" th:text="#{inventory.adjustment.reason}">Reason</th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['status']}"
                                           th:hx-get="${sortUrl['status']}"
                                           th:classappend="${sortClass['status']}"
                                           th:text="#{inventory.adjustment.status}">Status</a>
                                    </th>
                                    <th scope="col" th:text="#{inventory.adjustment.requestedBy}">Requested by</th>
                                    <th scope="col" class="text-right" th:text="#{inventory.adjustment.lineCount}">
                                        Lines
                                    </th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['createdAt']}"
                                           th:hx-get="${sortUrl['createdAt']}"
                                           th:classappend="${sortClass['createdAt']}"
                                           th:text="#{inventory.adjustment.created}">Created</a>
                                    </th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="a : ${page.content()}">
                                    <td><a th:href="@{/adjustments/{id}(id=${a.id()})}"
                                           th:text="${a.adjustmentNumber()}">ADJ-000001</a></td>
                                    <td><span th:text="${a.reasonName()}">Reason</span> <span class="wms-muted"
                                                                                              th:text="${a.reasonCode()}">CODE</span>
                                    </td>
                                    <td><span
                                            th:replace="~{inventory/fragments :: adjustmentStatus(${a.status()})}"></span>
                                    </td>
                                    <td th:text="${a.requestedByName()}"></td>
                                    <td class="text-right" th:text="${a.lineCount()}">1</td>
                                    <td th:text="${@uiFormat.dateTime(a.createdAt())}"></td>
                                </tr>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="6" class="text-center wms-muted" th:text="#{common.noResults}">No
                                        results
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}">Showing</small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
