<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'incoming-transfers')}">
<head>
    <title th:text="#{inventory.incoming.title}">Incoming transfers</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="card-title" th:text="#{inventory.incoming.title}">Incoming transfers</div>
                    <hr>
                    <small class="wms-muted" th:text="#{inventory.incoming.hint}">Goods on their way to this warehouse</small>
                    <div class="table-responsive mt-2">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th scope="col" th:text="#{inventory.transfer.number}">Number</th>
                                <th scope="col" th:text="#{inventory.incoming.from}">From</th>
                                <th scope="col" class="text-right" th:text="#{inventory.transfer.lineCount}">Lines</th>
                                <th scope="col" th:text="#{inventory.transfer.shipped}">Shipped</th>
                                <th scope="col"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r : ${rows}" th:with="t=${r.transfer()}">
                                <td><a th:href="@{/transfers/{id}(id=${t.id()})}" th:text="${t.transferNumber()}">TRF-000001</a></td>
                                <td th:text="${r.sourceName()}">A</td>
                                <td class="text-right" th:text="${t.lineCount()}">1</td>
                                <td th:text="${@uiFormat.dateTime(t.shippedAt())}"></td>
                                <td class="text-right">
                                    <a class="btn btn-sm btn-light" th:href="@{/transfers/{id}(id=${t.id()})}" th:text="#{inventory.incoming.receive}">Receive</a>
                                </td>
                            </tr>
                            <tr th:if="${rows.isEmpty()}">
                                <td colspan="5" class="text-center wms-muted" th:text="#{inventory.incoming.empty}">Nothing is on its way.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
