<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, ${menu})}">
<head>
    <title th:text="#{inventory.adjustment.detail}">Adjustment</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{inventory.adjustment.detail}">Adjustment</div>
                        <a class="btn btn-secondary btn-sm"
                           th:href="${menu == 'my-adjustments'} ? @{/adjustments/my} : @{/adjustments}"
                           th:text="#{inventory.action.back}">Back</a>
                    </div>
                    <hr>
                    <div th:replace="~{inventory/adjustment-detail :: panel}"></div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- Re-rendered as a whole after approve, reject and cancel. -->
<div id="adjustment-panel" th:fragment="panel" th:with="a=${view.adjustment()}">

    <div class="alert alert-success alert-dismissible" th:if="${notice}">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        <div class="alert-message" th:text="#{${notice}(${a.adjustmentNumber()})}">Done</div>
    </div>
    <div class="alert alert-danger alert-dismissible" th:if="${error}">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        <div class="alert-message" th:text="${error}">Problem</div>
    </div>

    <div class="row">
        <div class="col-md-3 mb-3">
            <small class="wms-muted" th:text="#{inventory.adjustment.number}">Number</small>
            <div><strong th:text="${a.adjustmentNumber()}">ADJ-000001</strong></div>
        </div>
        <div class="col-md-3 mb-3">
            <small class="wms-muted" th:text="#{inventory.adjustment.status}">Status</small>
            <div><span th:replace="~{inventory/fragments :: adjustmentStatus(${a.status()})}"></span></div>
        </div>
        <div class="col-md-3 mb-3">
            <small class="wms-muted" th:text="#{inventory.adjustment.reason}">Reason</small>
            <div><span th:text="${a.reasonName()}">Reason</span> <span class="wms-muted" th:text="${a.reasonCode()}">CODE</span>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <small class="wms-muted" th:text="#{inventory.adjustment.created}">Created</small>
            <div th:text="${@uiFormat.dateTime(a.createdAt())}"></div>
        </div>
        <div class="col-md-3 mb-3">
            <small class="wms-muted" th:text="#{inventory.adjustment.requestedBy}">Requested by</small>
            <div th:text="${a.requestedByName()}"></div>
        </div>
        <div class="col-md-3 mb-3" th:if="${a.decidedAt() != null}">
            <small class="wms-muted" th:text="#{inventory.adjustment.decided}">Decided</small>
            <div><span th:text="${a.decidedByName()}"></span> <span class="wms-muted"
                                                                    th:text="${@uiFormat.dateTime(a.decidedAt())}"></span>
            </div>
        </div>
        <div class="col-md-6 mb-3" th:if="${a.notes() != null}">
            <small class="wms-muted" th:text="#{inventory.adjustment.notes}">Notes</small>
            <div th:text="${a.notes()}"></div>
        </div>
        <div class="col-md-12 mb-3" th:if="${a.rejectionReason() != null}">
            <small class="wms-muted" th:text="#{inventory.adjustment.rejectionReason}">Rejection reason</small>
            <div th:text="${a.rejectionReason()}"></div>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col" th:text="#{inventory.stock.bin}">Bin</th>
                <th scope="col" th:text="#{inventory.stock.item}">Item</th>
                <th scope="col" th:text="#{inventory.stock.lot}">Lot</th>
                <th scope="col" th:text="#{inventory.stock.expiry}">Expiry</th>
                <th scope="col" th:text="#{inventory.stock.serial}">Serial</th>
                <th scope="col" class="text-right" th:text="#{inventory.adjustment.change}">Change</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l : ${a.lines()}">
                <td th:text="${l.lineNo()}">1</td>
                <td th:text="${l.locationCode()}">A-01</td>
                <td><span th:text="${l.itemSku()}">SKU</span> <span class="wms-muted"
                                                                    th:text="${l.itemName()}">Name</span></td>
                <td th:text="${l.lotNumber()}"></td>
                <td th:text="${@invFormat.date(l.expiryDate())}"></td>
                <td th:text="${l.serialNumber()}"></td>
                <td class="text-right"
                    th:classappend="${l.quantityDelta().signum() > 0} ? 'text-success' : 'text-danger'"
                    th:text="${@invFormat.signedQty(l.quantityDelta())}">+1
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="alert alert-info" th:if="${view.ownPendingByManager()}" th:text="#{inventory.adjustment.selfApproval}">
        Another manager must approve
    </div>

    <div class="mt-3" th:if="${view.canApprove() or view.canCancel()}">
        <button type="button" class="btn btn-success" th:if="${view.canApprove()}"
                th:attr="hx-post=@{/adjustments/{id}/approve(id=${a.id()})}, hx-confirm=#{inventory.adjustment.approve.confirm}"
                hx-target="#adjustment-panel" hx-swap="outerHTML">
            <i class="zmdi zmdi-check"></i> <span th:text="#{inventory.adjustment.approve}">Approve</span>
        </button>
        <button type="button" class="btn btn-secondary" th:if="${view.canCancel()}"
                th:attr="hx-post=@{/adjustments/{id}/cancel(id=${a.id()})}, hx-confirm=#{inventory.adjustment.cancel.confirm}"
                hx-target="#adjustment-panel" hx-swap="outerHTML">
            <i class="zmdi zmdi-close"></i> <span th:text="#{inventory.adjustment.cancel}">Cancel adjustment</span>
        </button>
    </div>

    <form class="mt-3" method="post" th:if="${view.canReject()}" th:object="${rejectForm}"
          th:action="@{/adjustments/{id}/reject(id=${a.id()})}"
          th:attr="hx-post=@{/adjustments/{id}/reject(id=${a.id()})}"
          hx-target="#adjustment-panel" hx-swap="outerHTML">
        <div class="form-group">
            <label for="reject-reason" th:text="#{inventory.adjustment.rejectReason}">Reason for rejecting</label>
            <textarea id="reject-reason" rows="2" class="form-control" th:field="*{reason}"
                      th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('reason')}" th:errors="*{reason}">Error</div>
        </div>
        <button type="submit" class="btn btn-danger" th:text="#{inventory.adjustment.reject}">Reject</button>
    </form>
</div>
</body>
</html>
