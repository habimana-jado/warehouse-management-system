<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'transfers')}">
<head>
    <title th:text="#{inventory.transfers.title}">Transfers</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{inventory.transfers.title}">Transfers</div>
                        <a class="btn btn-light btn-sm" th:href="@{/transfers/new}"
                           th:if="${@uiUser.isAdmin() or @uiUser.hasRole('WAREHOUSE_MANAGER')}">
                            <i class="zmdi zmdi-plus"></i> <span th:text="#{inventory.transfer.new}">New transfer</span>
                        </a>
                    </div>
                    <hr>
                    <form id="transfers-filters" method="get" th:action="@{/transfers}" th:object="${filter}"
                          th:hx-get="@{/transfers}" hx-trigger="input delay:400ms, change, submit"
                          hx-target="#transfers-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <div class="position-relative has-icon-right">
                                    <input type="text" class="form-control input-shadow" th:field="*{q}"
                                           autocomplete="off"
                                           th:placeholder="#{inventory.transfers.search}">
                                    <div class="form-control-position"><i class="icon-magnifier"></i></div>
                                </div>
                            </div>
                            <div class="form-group col-md-3">
                                <select class="form-control" th:field="*{status}">
                                    <option value="" th:text="#{inventory.filter.allStatuses}">All statuses</option>
                                    <option th:each="s : ${statuses}" th:value="${s}"
                                            th:text="#{'inventory.transfer.status.' + ${s}}">Status
                                    </option>
                                </select>
                            </div>
                        </div>
                    </form>

                    <div id="transfers-results" th:fragment="results" hx-target="#transfers-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['transferNumber']}"
                                           th:hx-get="${sortUrl['transferNumber']}"
                                           th:classappend="${sortClass['transferNumber']}"
                                           th:text="#{inventory.transfer.number}">Number</a>
                                    </th>
                                    <th scope="col" th:text="#{inventory.transfer.type}">Type</th>
                                    <th scope="col" th:text="#{inventory.transfer.route}">From - to</th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['status']}"
                                           th:hx-get="${sortUrl['status']}"
                                           th:classappend="${sortClass['status']}"
                                           th:text="#{inventory.transfer.status}">Status</a>
                                    </th>
                                    <th scope="col" class="text-right" th:text="#{inventory.transfer.lineCount}">Lines
                                    </th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['createdAt']}"
                                           th:hx-get="${sortUrl['createdAt']}"
                                           th:classappend="${sortClass['createdAt']}"
                                           th:text="#{inventory.transfer.created}">Created</a>
                                    </th>
                                    <th scope="col"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="r : ${page.content()}" th:with="t=${r.transfer()}">
                                    <td th:text="${t.transferNumber()}">TRF-000001</td>
                                    <td><span th:replace="~{inventory/fragments :: transferType(${t.type()})}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${r.sourceName()}">A</span>
                                        <span th:if="${t.type().name() == 'INTER_WAREHOUSE'}"> &rarr; <span
                                                th:text="${r.destinationName()}">B</span></span>
                                    </td>
                                    <td><span
                                            th:replace="~{inventory/fragments :: transferStatus(${t.status()})}"></span>
                                    </td>
                                    <td class="text-right" th:text="${t.lineCount()}">1</td>
                                    <td th:text="${@uiFormat.dateTime(t.createdAt())}"></td>
                                    <td class="text-right">
                                        <a class="btn btn-sm btn-light" th:href="@{/transfers/{id}(id=${t.id()})}">
                                            <i class="zmdi zmdi-eye"></i> <span
                                                th:text="#{inventory.action.view}">View</span>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="7" class="text-center wms-muted" th:text="#{common.noResults}">No
                                        results
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}">Showing</small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
