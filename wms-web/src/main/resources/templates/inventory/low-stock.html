<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'low-stock')}">
<head>
    <title th:text="#{inventory.lowstock.title}">Low stock</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{inventory.lowstock.title}">Low stock</div>
                        <a class="btn btn-secondary btn-sm" th:href="@{/reorder-policies}"
                           th:text="#{inventory.lowstock.manage}">Manage policies</a>
                    </div>
                    <hr>
                    <small class="wms-muted" th:text="#{inventory.lowstock.hint}">Storage bins only</small>
                    <div class="table-responsive mt-2">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th scope="col" th:text="#{inventory.reorder.item}">Item</th>
                                <th scope="col" class="text-right" th:text="#{inventory.lowstock.onHand}">In storage
                                </th>
                                <th scope="col" class="text-right" th:text="#{inventory.reorder.min}">Reorder point</th>
                                <th scope="col" class="text-right" th:text="#{inventory.reorder.max}">Maximum</th>
                                <th scope="col" class="text-right" th:text="#{inventory.lowstock.suggested}">Suggested
                                    order
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="l : ${rows}">
                                <td>
                                    <span th:text="${l.itemSku()}">SKU</span> <span class="wms-muted"
                                                                                    th:text="${l.itemName()}">Name</span>
                                    <span class="badge badge-danger" th:if="${l.onHand().signum() == 0}"
                                          th:text="#{inventory.lowstock.out}">Out of stock</span>
                                </td>
                                <td class="text-right"><strong th:text="${@invFormat.qty(l.onHand())}">0</strong> <span
                                        class="wms-muted" th:text="${l.baseUom()}">pcs</span></td>
                                <td class="text-right" th:text="${@invFormat.qty(l.minQty())}">0</td>
                                <td class="text-right"
                                    th:text="${l.maxQty() == null} ? '-' : ${@invFormat.qty(l.maxQty())}">-
                                </td>
                                <td class="text-right"><strong th:text="${@invFormat.qty(l.suggestedQty())}">0</strong>
                                </td>
                            </tr>
                            <tr th:if="${rows.isEmpty()}">
                                <td colspan="5" class="text-center wms-muted" th:text="#{inventory.lowstock.empty}">
                                    Nothing is below its reorder point.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
