<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'movements')}">
<head>
    <title th:text="#{inventory.movements.title}">Stock movements</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="card-title" th:text="#{inventory.movements.title}">Stock movements</div>
                    <hr>
                    <form id="movements-filters" method="get" th:action="@{/stock/movements}" th:object="${filter}"
                          th:hx-get="@{/stock/movements}"
                          hx-trigger="input[target.name != 'item'] delay:400ms, change, submit"
                          hx-target="#movements-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label for="mv-bin" th:text="#{inventory.filter.bin}">Bin</label>
                                <select id="mv-bin" class="form-control" th:field="*{locationId}">
                                    <option value="" th:text="#{inventory.filter.allBins}">All bins</option>
                                    <option th:each="b : ${bins}" th:value="${b.id()}" th:text="${b.code()}">A-01
                                    </option>
                                </select>
                            </div>
                            <div class="form-group col-md-3">
                                <label for="mv-item" th:text="#{inventory.filter.item}">Item</label>
                                <input id="mv-item" type="text" class="form-control" th:field="*{item}"
                                       list="item-options" autocomplete="off"
                                       th:placeholder="#{inventory.filter.item.hint}"
                                       th:attr="hx-get=@{/lookup/items}" hx-trigger="input changed delay:300ms"
                                       hx-target="#item-options" hx-swap="innerHTML" hx-push-url="false">
                                <datalist id="item-options"></datalist>
                            </div>
                            <div class="form-group col-md-3">
                                <label for="mv-type" th:text="#{inventory.filter.type}">Type</label>
                                <select id="mv-type" class="form-control" th:field="*{type}">
                                    <option value="" th:text="#{inventory.filter.allTypes}">All types</option>
                                    <option th:each="t : ${movementTypes}" th:value="${t}"
                                            th:text="#{'inventory.movement.type.' + ${t}}">Type
                                    </option>
                                </select>
                            </div>
                            <div class="form-group col-md-3">
                                <label for="mv-serial" th:text="#{inventory.filter.serial}">Serial number</label>
                                <input id="mv-serial" type="text" class="form-control" th:field="*{serial}"
                                       autocomplete="off">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group col-md-3">
                                <label for="mv-from" th:text="#{inventory.filter.from}">From</label>
                                <input id="mv-from" type="date" class="form-control" th:field="*{from}">
                            </div>
                            <div class="form-group col-md-3">
                                <label for="mv-to" th:text="#{inventory.filter.to}">To</label>
                                <input id="mv-to" type="date" class="form-control" th:field="*{to}">
                            </div>
                        </div>
                    </form>

                    <div id="movements-results" th:fragment="results" hx-target="#movements-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="alert alert-info" th:if="${error}" th:text="#{${error}(${errorArg})}">Problem</div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['occurredAt']}"
                                           th:hx-get="${sortUrl['occurredAt']}"
                                           th:classappend="${sortClass['occurredAt']}"
                                           th:text="#{inventory.movements.time}">Time</a>
                                    </th>
                                    <th scope="col" th:text="#{inventory.movements.type}">Type</th>
                                    <th scope="col" th:text="#{inventory.stock.bin}">Bin</th>
                                    <th scope="col" th:text="#{inventory.stock.item}">Item</th>
                                    <th scope="col" th:text="#{inventory.stock.lot}">Lot / serial</th>
                                    <th scope="col" class="text-right">
                                        <a class="wms-sort" th:href="${sortUrl['quantity']}"
                                           th:hx-get="${sortUrl['quantity']}"
                                           th:classappend="${sortClass['quantity']}"
                                           th:text="#{inventory.stock.quantity}">Quantity</a>
                                    </th>
                                    <th scope="col" class="text-right" th:text="#{inventory.movements.balanceAfter}">
                                        Balance
                                    </th>
                                    <th scope="col" th:text="#{inventory.movements.reference}">Reference</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="m : ${page.content()}">
                                    <td th:text="${@uiFormat.dateTime(m.occurredAt())}"></td>
                                    <td><span th:replace="~{inventory/fragments :: movementType(${m.type()})}"></span>
                                    </td>
                                    <td th:text="${m.locationCode()}"></td>
                                    <td><span th:text="${m.itemSku()}">SKU</span> <span class="wms-muted"
                                                                                        th:text="${m.itemName()}">Name</span>
                                    </td>
                                    <td>
                                        <span th:text="${m.lotNumber()}"></span>
                                        <span th:if="${m.expiryDate() != null}" class="wms-muted"
                                              th:text="'(' + ${@invFormat.date(m.expiryDate())} + ')'"></span>
                                        <span th:text="${m.serialNumber()}"></span>
                                    </td>
                                    <td class="text-right"
                                        th:classappend="${m.quantity().signum() > 0} ? 'text-success' : 'text-danger'"
                                        th:text="${@invFormat.signedQty(m.quantity())}">0
                                    </td>
                                    <td class="text-right" th:text="${@invFormat.qty(m.balanceAfter())}">0</td>
                                    <td>
                                        <span th:text="${m.referenceNumber()}"></span>
                                        <span class="wms-muted" th:text="${m.note()}"></span>
                                    </td>
                                </tr>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="8" class="text-center wms-muted" th:text="#{common.noResults}">No
                                        results
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}">Showing</small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
