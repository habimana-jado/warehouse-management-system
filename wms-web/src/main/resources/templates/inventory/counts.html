<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'counts')}">
<head>
    <title th:text="#{inventory.counts.title}">Cycle counts</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="card-title mb-0" th:text="#{inventory.counts.title}">Cycle counts</div>
                        <a class="btn btn-light btn-sm" th:href="@{/counts/new}"
                           th:if="${@uiUser.isAdmin() or @uiUser.hasRole('WAREHOUSE_MANAGER')}">
                            <i class="zmdi zmdi-plus"></i> <span th:text="#{inventory.count.new}">New count</span>
                        </a>
                    </div>
                    <hr>
                    <form id="counts-filters" method="get" th:action="@{/counts}" th:object="${filter}"
                          th:hx-get="@{/counts}" hx-trigger="input delay:400ms, change, submit"
                          hx-target="#counts-results" hx-swap="outerHTML" hx-push-url="true">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <div class="position-relative has-icon-right">
                                    <input type="text" class="form-control input-shadow" th:field="*{q}"
                                           autocomplete="off"
                                           th:placeholder="#{inventory.counts.search}">
                                    <div class="form-control-position"><i class="icon-magnifier"></i></div>
                                </div>
                            </div>
                            <div class="form-group col-md-3">
                                <select class="form-control" th:field="*{status}">
                                    <option value="" th:text="#{inventory.filter.allStatuses}">All statuses</option>
                                    <option th:each="s : ${statuses}" th:value="${s}"
                                            th:text="#{'inventory.count.status.' + ${s}}">Status
                                    </option>
                                </select>
                            </div>
                        </div>
                    </form>

                    <div id="counts-results" th:fragment="results" hx-target="#counts-results" hx-swap="outerHTML"
                         hx-push-url="true">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['countNumber']}"
                                           th:hx-get="${sortUrl['countNumber']}"
                                           th:classappend="${sortClass['countNumber']}"
                                           th:text="#{inventory.count.number}">Number</a>
                                    </th>
                                    <th scope="col" th:text="#{inventory.count.scope}">Scope</th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['status']}"
                                           th:hx-get="${sortUrl['status']}"
                                           th:classappend="${sortClass['status']}" th:text="#{inventory.count.status}">Status</a>
                                    </th>
                                    <th scope="col" class="text-right" th:text="#{inventory.count.progress}">Counted
                                    </th>
                                    <th scope="col">
                                        <a class="wms-sort" th:href="${sortUrl['createdAt']}"
                                           th:hx-get="${sortUrl['createdAt']}"
                                           th:classappend="${sortClass['createdAt']}"
                                           th:text="#{inventory.count.created}">Created</a>
                                    </th>
                                    <th scope="col" th:text="#{inventory.count.completed}">Completed</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="r : ${page.content()}" th:with="c=${r.count()}">
                                    <td><a th:href="@{/counts/{id}(id=${c.id()})}" th:text="${c.countNumber()}">CNT-000001</a>
                                    </td>
                                    <td th:text="${r.zoneName() != null} ? ${r.zoneName()} : #{inventory.count.wholeWarehouse}">
                                        Whole warehouse
                                    </td>
                                    <td><span th:replace="~{inventory/fragments :: countStatus(${c.status()})}"></span>
                                    </td>
                                    <td class="text-right" th:text="${c.countedLines()} + ' / ' + ${c.totalLines()}">0 /
                                        0
                                    </td>
                                    <td th:text="${@uiFormat.dateTime(c.createdAt())}"></td>
                                    <td th:text="${@uiFormat.dateTime(c.completedAt())}"></td>
                                </tr>
                                <tr th:if="${page.content().isEmpty()}">
                                    <td colspan="6" class="text-center wms-muted" th:text="#{common.noResults}">No
                                        results
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="wms-muted"
                                   th:utext="#{common.showing(${page.from()}, ${page.to()}, ${page.totalElements()})}">Showing</small>
                            <div th:replace="~{fragments/pagination :: pager(${page})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
