<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'categories')}">
<head><title th:text="#{categories.new.title}">New Category</title></head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <div class="card-title" th:text="#{categories.new.title}">New Category</div>
                    <hr>
                    <form th:action="@{/categories}" th:object="${form}" method="post" novalidate>
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                        </div>

                        <div th:replace="~{fragments/form-fields :: input('name', 'categories.field.name', 'text', true, 'off')}"></div>
                        <div th:replace="~{fragments/form-fields :: input('description', 'categories.field.description', 'text', false, 'off')}"></div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-light px-5"><i class="icon-lock"></i> <span th:text="#{categories.save}">Save</span></button>
                            <a class="btn btn-secondary px-4" th:href="@{/categories}" th:text="#{common.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
