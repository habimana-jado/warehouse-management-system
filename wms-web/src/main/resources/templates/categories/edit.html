<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'categories')}">
<head><title th:text="#{categories.edit.title}">Edit Category</title></head>
<body>

<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <div class="card-title" th:text="#{categories.edit.title}">Edit Category</div>
                    <hr>
                    <th:block th:replace="~{::detailsCard}"></th:block>
                </div>
            </div>
        </div>
    </div>
</th:block>

<div id="details-card" th:fragment="detailsCard">
    <form th:object="${form}" method="post"
          th:action="@{/categories/{id}/details(id=${categoryId})}"
          th:hx-post="@{/categories/{id}/details(id=${categoryId})}"
          hx-target="#details-card" hx-swap="outerHTML">
        <div class="alert alert-success" th:if="${saved}" th:text="#{common.saved}">Saved</div>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <div th:replace="~{fragments/form-fields :: input('name', 'categories.field.name', 'text', true, 'off')}"></div>
        <div th:replace="~{fragments/form-fields :: input('description', 'categories.field.description', 'text', false, 'off')}"></div>

        <button type="submit" class="btn btn-light px-5" th:text="#{categories.update}">Update category</button>
        <a class="btn btn-secondary px-4" th:href="@{/categories}" th:text="#{common.cancel}">Cancel</a>
    </form>
</div>

</body>
</html>
