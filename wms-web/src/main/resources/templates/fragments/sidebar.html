<!-- fragments/sidebar.html -->
<div id="sidebar-wrapper" data-simplebar="" data-simplebar-auto-hide="true" th:fragment="sidebar(active)">
    <div class="brand-logo">
        <a th:href="@{/}">
            <img th:src="@{/assets/images/logo-icon.png}" class="logo-icon" alt="logo">
            <h5 class="logo-text" th:text="#{app.name}">WMS</h5>
        </a>
    </div>
    <ul class="sidebar-menu do-nicescrol">
        <li class="sidebar-header" th:text="#{menu.main}">MAIN NAVIGATION</li>
        <li th:classappend="${active == 'dashboard'} ? 'active'">
            <a th:href="@{/}"><i class="zmdi zmdi-view-dashboard"></i> <span th:text="#{menu.dashboard}">Dashboard</span></a>
        </li>

        <th:block th:if="${@uiUser.isAdmin()}">
            <li class="sidebar-header" th:text="#{menu.admin}">ADMINISTRATION</li>
            <li th:classappend="${active == 'users'} ? 'active'">
                <a th:href="@{/users}"><i class="zmdi zmdi-accounts"></i> <span th:text="#{menu.users}">Users</span></a>
            </li>
        </th:block>

        <!-- each feature chat adds its entry here, for example:
        <li th:if="${@uiUser.hasRole('WAREHOUSE_MANAGER') or @uiUser.isAdmin()}" th:classappend="${active == 'items'} ? 'active'">
            <a th:href="@{/items}"><i class="zmdi zmdi-label"></i> <span th:text="#{menu.items}">Items</span></a>
        </li>
        -->
    </ul>
</div>
