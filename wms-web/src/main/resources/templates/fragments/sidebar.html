<div id="sidebar-wrapper" data-simplebar="" data-simplebar-auto-hide="true" th:fragment="sidebar(active)">
    <div class="brand-logo">
        <a th:href="@{/}">
            <img th:src="@{/assets/images/logo-icon.png}" class="logo-icon" alt="logo">
            <h5 class="logo-text" th:text="#{app.name}">WMS</h5>
        </a>
    </div>
    <ul class="sidebar-menu do-nicescrol">
        <li>
            <a th:href="@{/}"><i class="zmdi zmdi-apps"></i> <span th:text="#{nav.allModules}">All modules</span></a>
        </li>
        <th:block th:if="${nav != null and nav.module() != null}">
            <li class="sidebar-header" th:text="#{${nav.module().labelKey()}}">MODULE</li>
            <th:block th:each="sec : ${nav.sections()}">
                <li class="sidebar-header" th:if="${sec.titleKey() != null}" th:text="#{${sec.titleKey()}}">SECTION</li>
                <li th:each="link : ${sec.items()}" th:classappend="${link.active()} ? 'active'">
                    <a th:href="@{${link.url()}}"><i th:class="${link.icon()}"></i> <span th:text="#{${link.labelKey()}}">Item</span></a>
                </li>
            </th:block>
        </th:block>
    </ul>
</div>
