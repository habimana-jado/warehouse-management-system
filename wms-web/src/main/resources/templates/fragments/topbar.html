<!-- fragments/topbar.html -->
<header class="topbar-nav" th:fragment="topbar">
    <nav class="navbar navbar-expand fixed-top">
        <ul class="navbar-nav mr-auto align-items-center">
            <li class="nav-item">
                <a class="nav-link toggle-menu" href="javascript:void(0);"><i class="icon-menu menu-icon"></i></a>
            </li>
            <li class="nav-item dropdown" th:with="sel=${@warehouseContext.selection()}">
                <a class="nav-link dropdown-toggle dropdown-toggle-nocaret" data-toggle="dropdown" href="#">
                    <i class="zmdi zmdi-store mr-1"></i>
                    <span th:text="${sel.current() != null} ? ${sel.current().code()} : #{warehouse.none}">A-01</span>
                    <i class="fa fa-angle-down ml-1"></i>
                </a>
                <form class="dropdown-menu" th:action="@{/warehouse/select}" method="post" th:if="${!sel.options().isEmpty()}">
                    <button type="submit" class="dropdown-item" name="warehouseId"
                            th:each="w : ${sel.options()}" th:value="${w.id()}"
                            th:classappend="${sel.current() != null and w.id() == sel.current().id()} ? 'active'"
                            th:text="${w.code()} + ' · ' + ${w.name()}">A-01 · Main</button>
                </form>
            </li>
        </ul>
        <ul class="navbar-nav align-items-center right-nav-link">
            <li class="nav-item">
                <a class="nav-link dropdown-toggle dropdown-toggle-nocaret" data-toggle="dropdown" href="#">
                    <span class="user-profile"><img th:src="@{/assets/images/avatar.png}" class="img-circle" alt="user"></span>
                </a>
                <ul class="dropdown-menu dropdown-menu-right">
                    <li class="dropdown-item user-details">
                        <div class="media">
                            <div class="avatar"><img class="align-self-start mr-3" th:src="@{/assets/images/avatar.png}" alt="user"></div>
                            <div class="media-body"><h6 class="mt-2 user-title" th:text="${@uiUser.name()}">admin</h6></div>
                        </div>
                    </li>
                    <li class="dropdown-divider"></li>
                    <li class="dropdown-item">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-link p-0 wms-logout">
                                <i class="icon-power mr-2"></i><span th:text="#{menu.logout}">Logout</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>
</header>
