<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content}, ~{}, 'modules')}">
<head><title th:text="#{nav.allModules}">All modules</title></head>
<body>
<th:block th:fragment="content">
    <div class="row mt-3">
        <div class="col-lg-4 col-md-6" th:each="m : ${nav.modules()}">
            <div class="card">
                <div class="card-body text-center">
                    <i th:class="|${m.icon()} wms-tile-icon|"></i>
                    <h5 class="mt-3" th:text="#{${m.labelKey()}}">Inbound</h5>
                    <p class="wms-muted" th:text="#{${m.descriptionKey()}}">Purchase orders, receiving and put-away.</p>
                    <a class="btn btn-light px-4" th:href="@{${m.homeUrl()}}" th:text="#{nav.open}">Open</a>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${nav.modules().isEmpty()}">
            <div class="alert alert-info" th:text="#{nav.noModules}">No module is available for your account.</div>
        </div>
    </div>
</th:block>
</body>
</html>
