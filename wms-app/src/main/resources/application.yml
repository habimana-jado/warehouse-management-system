spring:
  application:
    name: warehouse-management-system
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  flyway:
    enabled: true

wms:
  security:
    jwt:
      secret: ${WMS_JWT_SECRET}          # >= 32 chars, never commit it
      access-ttl: 60m
      refresh-ttl: 7d
    lockout:
      max-attempts: 5
      duration: 15m
    bootstrap:
      admin-username: ${WMS_ADMIN_USER:admin}
      admin-password: ${WMS_ADMIN_PASSWORD:password123}   # only used when the users table is empty
  reporting:
    zone: Africa/Kigali        # zone for all date ranges and daily series
    currency: RWF              # label on the valuation report (the ledger has no currency column)
    export-max-rows: 20000     # CSV exports above this are refused with EXPORT_TOO_LARGE
    default-expiry-days: 30    # expiry report horizon when `days` is not sent

server:
  forward-headers-strategy: framework      # correct client IP behind a proxy