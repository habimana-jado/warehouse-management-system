server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_dev_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
wms:
  reporting:
    zone: Africa/Kigali        # zone for all date ranges and daily series
    currency: RWF              # label on the valuation report (the ledger has no currency column)
    export-max-rows: 20000     # CSV exports above this are refused with EXPORT_TOO_LARGE
    default-expiry-days: 30    # expiry report horizon when `days` is not sent

logging:
  level:
    org.hibernate.stat: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG                # prints each report's SQL
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE       # prints bind values